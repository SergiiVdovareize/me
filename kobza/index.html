<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf9f6" />
    <title>Кобза — Гра в слова</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪶</text></svg>"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Arsenal:wght@400;700&family=Yeseva+One&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game">
      <div class="status-wrap">
        <div id="status" class="status" role="status" aria-live="polite"></div>
      </div>

      <section aria-label="Ігрове поле">
        <div id="board" class="board"></div>
      </section>

      <section class="keyboard-section" aria-label="Екранна клавіатура">
        <div id="keyboard" class="keyboard"></div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
